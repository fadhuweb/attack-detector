mode: monitor            # off | monitor | enforce
                         #   off     = do nothing
                         #   monitor = detect + alert, never block  (safe default)
                         #   enforce = detect + alert + block offenders via nftables
                         # change this live without restart: use ctl.py or edit control.json
auth_source: file        # file | journald
auth_log: /var/log/auth.log
journald_unit: ssh
from_start: false

admin_allowlist: ["10.0.2.2"]   # never blocked. YOUR admin path.
                         # enforce REFUSES to start (and refuses a live switch)
                         # if this is empty. Do NOT put 192.168.50.11 here.

responder_backend: nftables   # nftables (real blocking) | memory (dry run, logs only)
alert_log: alerts.log
responder_log: responder.log

# live control surface (day 4)
control_state: control.json      # {"mode": "..."} desired mode; engine polls it
control_commands: commands.jsonl # queued commands (unblock/block); engine drains it
control_status: status.json      # engine writes current state here for the dashboard

# brute-force rule
bf_window: 60
bf_threshold: 5
bf_pair_grace: 3.0

# aggregate flood rule (DDoS / volumetric) -- reads the nginx access log
access_log: /var/log/nginx/access.log
flood_enabled: true
flood_window: 10        # seconds
flood_threshold: 2000   # TOTAL requests across all IPs in the window fires
                        # set this above your normal peak. a distributed flood
                        # trips this even when no single IP looks busy.
flood_cooldown: 30      # seconds between flood alerts, so one flood alerts once
