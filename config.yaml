# attack-detector configuration. Reloaded live from day 4 onward.

# off | monitor | enforce
mode: monitor

# IPs that are never blocked or rate-limited.
#
# Empty on purpose: the engine refuses to start in enforce mode while this is
# empty, so blocking cannot go live before the value is set.
#
# Do NOT guess your workstation's IP. SSH from Windows arrives through the NAT
# port-forward, so the target sees the NAT gateway (10.0.2.x), not your Windows
# address. Run scripts/verify_day1.sh on the target to print the address it
# actually observes, and put that here.
#
# 192.168.50.11 (attacker VM) must never appear here: allowlisting it would
# make every simulated attack unblockable.
admin_allowlist: []
  # - 10.0.2.2      # <-- observed admin address. Fill in from verify_day1.sh.
  # - 127.0.0.1

sources:
  auth:
    # "file" for hosts with rsyslog (the lab target). "journald" for hosts
    # where /var/log/auth.log does not exist.
    type: file
    path: /var/log/auth.log
    unit: ssh

thresholds:
  failed_login: 5
  failed_login_window: 60

alerts:
  path: logs/alerts.log
