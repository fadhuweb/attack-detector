# attack-detector configuration. Reloaded live from day 4 onward.

# off | monitor | enforce
mode: monitor

# IPs that are never blocked or rate-limited.
# MUST list the address you administer the target from, or an enforcing rule
# can lock you out of the box. Fill in your Windows host's lab address before
# day 3, when blocking goes in.
# 192.168.50.11 (attacker VM) is deliberately absent: allowlisting it would
# make every simulated attack undetectable.
admin_allowlist:
  - 127.0.0.1
  # - 192.168.50.1   # <-- your admin workstation. CONFIRM AND UNCOMMENT.

sources:
  auth:
    # "file" for hosts with rsyslog (the lab target). "journald" for hosts
    # where /var/log/auth.log does not exist.
    type: file
    path: /var/log/auth.log
    unit: ssh

thresholds:
  failed_login: 5
  failed_login_window: 60

alerts:
  path: logs/alerts.log
